# SPDX-License-Identifier: AGPL-3.0-only
# Deploys the site to Cloudflare (Workers static assets, https://phloem.thales.sh) only when a GitHub release is published AND it is the
# one marked "Latest". Pushes to main and pull requests never deploy. To redeploy a release by hand: Actions > deploy > Run workflow, choosing
# the release tag (e.g. v1.1.0) as the ref. The two secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) live in the GitHub environment
# "Production", which only v* tags may use (Settings > Environments); tags v* cannot be moved or deleted (ruleset "Protect release tags").
# See docs/DEPLOY.md.
name: deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - id: check
        name: Is this tag the release marked Latest?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "Not a release tag ($GITHUB_REF): nothing to deploy."; echo "latest=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "$GITHUB_REF_NAME is not the latest release ($latest): nothing to deploy."
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.latest == 'true'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build and deploy (the build also fails if the e2e test hook or a placeholder ships)
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

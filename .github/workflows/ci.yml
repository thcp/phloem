# SPDX-License-Identifier: AGPL-3.0-only
# Continuous integration only: type-check, unit tests and a production build on every push and pull request.
# There is no deploy step here: the site is deployed by Cloudflare Pages from this repository (docs/DEPLOY.md).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build (also fails if the e2e test hook or a placeholder ships)
        run: npm run build
